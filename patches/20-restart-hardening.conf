[Unit]
# Never stop trying to restart — a bot should always come back, even after many
# flaps. (0 disables the start-rate limiter entirely.)
StartLimitIntervalSec=0

[Service]
# Root cause of the 10-day outage (2026-07-29): during network flakiness ccgram
# reset its Telegram long-poll and hit a transient 409 ("another bot instance is
# polling") — really a collision with its OWN reconnecting poll. ccgram treats
# that as fatal and self-SIGINTs. That is a *clean* exit, so Restart=on-failure
# ignored it and the bridge stayed dead.
#
# Restart=always revives ccgram regardless of how it exits. RestartSec (10s, from
# the base unit) gives Telegram time to drop the stale poll so the reconnect does
# not immediately re-conflict. Combined with KillMode=process (base unit), a
# restart leaves tmux + all live Claude sessions untouched.
Restart=always
