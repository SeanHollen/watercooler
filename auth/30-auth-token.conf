[Service]
# Load the long-lived Claude auth token (CLAUDE_CODE_OAUTH_TOKEN) into ccgram's
# environment. On boot, ccgram spawns a fresh tmux server that inherits this, so
# every Claude session it launches is authenticated with no browser login.
# Renew (~yearly) with: claude setup-token  ->  watercooler-set-token <token>
EnvironmentFile=-/home/seanhollen/.ccgram/auth.env
